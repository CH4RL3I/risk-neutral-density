[project]
name = "rnd"
version = "0.1.0"
description = "Implied risk-neutral distributions from option prices via Breeden-Litzenberger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]

[project.scripts]
rnd = "rnd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
